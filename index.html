<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Online - SHINA-AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f0f8ff;
            --card-bg: rgba(255, 255, 255, 0.85);
            --accent-blue: #4ea8de;
            --accent-teal: #48cae4;
            --accent-green: #06d6a0;
            --text-dark: #2b2d42;
            --ios-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); /* iOS Smooth Curve */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #caf0f8 0%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        body::before {
            content: '✨';
            position: fixed;
            top: 10%;
            left: 10%;
            font-size: 24px;
            opacity: 0.5;
            animation: float 4s ease-in-out infinite;
        }
        body::after {
            content: '☁️';
            position: fixed;
            bottom: 10%;
            right: 10%;
            font-size: 28px;
            opacity: 0.5;
            animation: float 6s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(15deg); }
        }

        .phone-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 450px;
            border-radius: 35px;
            padding: 30px;
            box-shadow: var(--ios-shadow);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: var(--transition);
        }

        h2.title {
            font-family: 'Comfortaa', cursive;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            color: var(--accent-blue);
            font-size: 26px;
            text-shadow: 1px 1px 0px #fff, 2px 2px 0px rgba(78, 168, 222, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            padding-left: 5px;
            color: #5c677d;
        }

        input, select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            outline: none;
            transition: var(--transition);
            color: var(--text-dark);
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
            background: #fff;
            box-shadow: 0 0 15px rgba(78, 168, 222, 0.15);
        }

        /* Saat di-lock/disabled pasca-konfirmasi */
        input:disabled, select:disabled {
            background: rgba(220, 225, 230, 0.5) !important;
            color: #7f8c8d !important;
            border-color: transparent !important;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        /* Info Card untuk Total Harga di bawah pilihan */
        .info-card {
            max-height: 0;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            transition: var(--transition);
            opacity: 0;
        }

        .info-card.show {
            max-height: 100px;
            padding: 15px 18px;
            margin-top: 15px;
            opacity: 1;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .info-label {
            font-size: 11px;
            font-weight: 600;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .info-val {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .info-val.price {
            color: var(--accent-blue);
            font-size: 20px;
            text-align: right;
        }

        /* Payment Options */
        .payment-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 8px;
        }

        .pay-method {
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .pay-method:hover {
            transform: translateY(-2px);
        }

        .pay-method.active {
            border-color: var(--accent-teal);
            background: #fff;
            color: var(--accent-teal);
            box-shadow: 0 8px 20px rgba(72, 202, 228, 0.15);
        }

        /* Saat payment grid dimatikan */
        .payment-grid.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        .pay-method i {
            font-size: 20px;
        }

        /* Dynamic Payment Info Container */
        .payment-detail-box {
            max-height: 0;
            overflow: hidden;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            text-align: center;
            margin-top: 0;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
        }

        .payment-detail-box.show {
            max-height: 320px;
            margin-top: 15px;
            padding: 20px;
            border: 1px solid rgba(72, 202, 228, 0.2);
        }

        .number-display {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-dark);
            margin: 10px 0;
            padding: 10px;
            background: #f0f8ff;
            border-radius: 12px;
            display: inline-block;
            border: 1px dashed var(--accent-blue);
        }

        .qris-image {
            width: 150px;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: var(--ios-shadow);
            border: 4px solid #fff;
            background: #fff;
            margin-bottom: 10px;
        }

        .qris-note {
            font-size: 10px;
            color: #5c677d;
            line-height: 1.5;
            background: #fff3cd;
            color: #856404;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 500;
            margin-top: 5px;
            margin-bottom: 10px;
            border-left: 4px solid #ffc107;
            text-align: left;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.03);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-teal) 100%);
            color: white;
            margin-top: 20px;
        }

        .btn-primary:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            opacity: 0.6;
            transform: none !important;
            box-shadow: none;
        }

        .btn-primary:not(:disabled):active {
            transform: scale(0.97);
        }

        .btn-whatsapp {
            background: #25D366;
            color: white;
            margin-top: 15px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .btn-whatsapp:active {
            transform: scale(0.97);
        }

        .timer-box {
            display: none;
            text-align: center;
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            font-weight: 600;
            color: var(--accent-blue);
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

<div class="phone-container">
    <h2 class="title">✨KASIR SHINA-AI✨</h2>
    
    <div class="form-group">
        <label for="buyerName"><i class="fa-solid fa-user"></i> NAMA PELANGGAN</label>
        <input type="text" id="buyerName" placeholder="Masukkan nama kamu..." oninput="validateForm()">
    </div>

    <div class="form-group">
        <label for="productSelect"><i class="fa-solid fa-box-open"></i> PILIH PRODUK</label>
        <select id="productSelect" onchange="updateActivePeriods(); validateForm();">
            <option value="" disabled selected>-- Pilih Produk --</option>
            <option value="p1">Premium User</option>
            <option value="p2">Sewa Basic</option>
            <option value="p3">Sewa Plus</option>
            <option value="p4">Sewa VVIP</option>
        </select>
    </div>

    <div class="form-group">
        <label for="activePeriodSelect"><i class="fa-solid fa-hourglass-half"></i> PILIH MASA AKTIF</label>
        <select id="activePeriodSelect" disabled onchange="showFinalPrice(); validateForm();">
            <option value="" disabled selected>-- Pilih Produk Terlebih Dahulu --</option>
        </select>

        <div class="info-card" id="productInfoCard">
            <div class="info-item">
                <span class="info-label"><i class="fa-solid fa-tags"></i> Total Biaya Pembayaran</span>
                <span class="info-val price" id="valHarga">Rp 0</span>
            </div>
        </div>
    </div>

    <div class="form-group" style="margin-top: 25px;">
        <label><i class="fa-solid fa-credit-card"></i> METODE PEMBAYARAN</label>
        <div class="payment-grid" id="paymentGrid">
            <div class="pay-method" onclick="selectPayment('DANA')">
                <i class="fa-solid fa-wallet" style="color: #008cff;"></i>
                <span>DANA</span>
            </div>
            <div class="pay-method" onclick="selectPayment('GOPAY')">
                <i class="fa-solid fa-money-bill-wave" style="color: #00a651;"></i>
                <span>GOPAY</span>
            </div>
            <div class="pay-method" onclick="selectPayment('QRIS')">
                <i class="fa-solid fa-qrcode" style="color: #05a0d1;"></i>
                <span>QRIS</span>
            </div>
        </div>
    </div>

    <div class="payment-detail-box" id="paymentDetailBox">
        <div id="detailContent"></div>
    </div>

    <button id="btnConfirm" class="btn btn-primary" disabled onclick="startProcess()">
        <i class="fa-solid fa-circle-check"></i> Konfirmasi Pembayaran
    </button>

    <div class="timer-box" id="timerBox">
        <i class="fa-solid fa-spinner fa-spin"></i> Memproses pembayaran... (<span id="countdown">60</span>s)
    </div>

    <div id="waButtonContainer"></div>
</div>

<script>
    let selectedMethod = "";
    let finalProductName = "";
    let finalPriceText = "";
    let finalMasaAktifText = "";

    // CONFIG: Ubah nomor e-wallet milik kamu di sini
    const DANA_NUMBER = "0898-8189-120";
    const GOPAY_NUMBER = "0898-8189-120";
    const QRIS_IMAGE_URL = "https://i.ibb.co.com/XZMcFrSk/image-8c47b4bf-5822-484c-a6c0-93560ceca2a0.png";

    // DATABASE PRODUK, MASA AKTIF, DAN HARGA ASLINYA
    const pricingDatabase = {
        "p1": [
            { duration: "15 Hari", price: 7000 },
            { duration: "1 Bulan", price: 15000 },
            { duration: "2 Bulan", price: 30000 },
            { duration: "3 Bulan", price: 45000 },
            { duration: "5 Bulan", price: 75000},
            { duration: "1 Tahun", price: 160000 }
        ],
        "p2": [
            { duration: "1 Bulan", price: 15000 },
            { duration: "2 Bulan", price: 30000 },
            { duration: "3 Bulan", price: 45000 },
            { duration: "5 Bulan", price: 75000 },
            { duration: "1 Tahun", price: 180000 }
        ],
        "p3": [
            { duration: "1 Bulan", price: 25000 },
            { duration: "2 Bulan", price: 45000 },
            { duration: "3 Bulan", price: 75000 },
            { duration: "5 Bulan", price: 150000 },
            { duration: "1 Tahun", price: 300000 }
        ],
        "p4": [
            { duration: "1 Bulan", price: 35000 },
            { duration: "2 Bulan", price: 65000 },
            { duration: "3 Bulan", price: 100000 },
            { duration: "5 Bulan", price: 175000 },
            { duration: "1 Tahun", price: 410000 }
        ]
    };

    function updateActivePeriods() {
        const productSelect = document.getElementById('productSelect');
        const activeSelect = document.getElementById('activePeriodSelect');
        const infoCard = document.getElementById('productInfoCard');
        
        const productId = productSelect.value;
        const periods = pricingDatabase[productId];

        activeSelect.innerHTML = '<option value="" disabled selected>-- Pilih Masa Aktif --</option>';
        activeSelect.removeAttribute('disabled');
        
        infoCard.classList.remove('show');

        periods.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.price;
            opt.setAttribute('data-duration', item.duration);
            opt.innerText = `${item.duration} (Rp ${item.price.toLocaleString('id-ID')})`;
            activeSelect.appendChild(opt);
        });

        finalProductName = productSelect.options[productSelect.selectedIndex].text;
    }

    function showFinalPrice() {
        const activeSelect = document.getElementById('activePeriodSelect');
        const selectedOption = activeSelect.options[activeSelect.selectedIndex];
        
        const price = parseInt(selectedOption.value);
        finalMasaAktifText = selectedOption.getAttribute('data-duration');
        finalPriceText = "Rp " + price.toLocaleString('id-ID');

        document.getElementById('valHarga').innerText = finalPriceText;
        document.getElementById('productInfoCard').classList.add('show');
    }

    function selectPayment(method) {
        selectedMethod = method;
        
        document.querySelectorAll('.pay-method').forEach(el => {
            el.classList.remove('active');
            if(el.innerText.includes(method)) {
                el.classList.add('active');
            }
        });

        const detailBox = document.getElementById('paymentDetailBox');
        const detailContent = document.getElementById('detailContent');

        if (method === 'DANA') {
            detailContent.innerHTML = `
                <p style="font-weight:600; font-size:14px; color:#008cff;"><i class="fa-solid fa-wallet"></i> Transfer DANA</p>
                <div class="number-display">${DANA_NUMBER}</div>
                <p style="font-size:12px; color:#777;">Silahkan transfer sesuai nominal harga di atas.</p>
            `;
            detailBox.classList.add('show');
        } else if (method === 'GOPAY') {
            detailContent.innerHTML = `
                <p style="font-weight:600; font-size:14px; color:#00a651;"><i class="fa-solid fa-money-bill-wave"></i> Transfer GOPAY</p>
                <div class="number-display">${GOPAY_NUMBER}</div>
                <p style="font-size:12px; color:#777;">Silahkan transfer sesuai nominal harga di atas.</p>
            `;
            detailBox.classList.add('show');
        } else if (method === 'QRIS') {
            detailContent.innerHTML = `
             <div class="qris-note">
                    <i class="fa-solid fa-circle-info"></i> Unduh Barcode ini -> buka aplikasi pembayaran anda -> lalu bayar sesuai nominal harganya
                </div>
                <img src="${QRIS_IMAGE_URL}" alt="QRIS Code" class="qris-image" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=ContohQRISBABASSTORE'">
            `;                
            detailBox.classList.add('show');
        } else {
            detailBox.classList.remove('show');
        }

        validateForm();
    }

    function validateForm() {
        const name = document.getElementById('buyerName').value.trim();
        const product = document.getElementById('productSelect').value;
        const activePeriod = document.getElementById('activePeriodSelect').value;
        const btn = document.getElementById('btnConfirm');

        if(name !== "" && product !== "" && activePeriod !== "" && selectedMethod !== "") {
            btn.removeAttribute('disabled');
        } else {
            btn.setAttribute('disabled', 'true');
        }
    }

    function lockFormInputs() {
        document.getElementById('buyerName').setAttribute('disabled', 'true');
        document.getElementById('productSelect').setAttribute('disabled', 'true');
        document.getElementById('activePeriodSelect').setAttribute('disabled', 'true');
        document.getElementById('paymentGrid').classList.add('disabled');
    }

    function startProcess() {
        const btnConfirm = document.getElementById('btnConfirm');
        const timerBox = document.getElementById('timerBox');
        const countdownEl = document.getElementById('countdown');
        
        lockFormInputs();

        btnConfirm.style.display = 'none';
        timerBox.style.display = 'block';

        let timeLeft = 60; 
        
        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.innerText = timeLeft;

            if(timeLeft <= 0) {
                clearInterval(timer);
                timerBox.style.display = 'none';
                showWhatsAppButton();
            }
        }, 1000);
    }

    function showWhatsAppButton() {
        const container = document.getElementById('waButtonContainer');
        
        const waBtn = document.createElement('button');
        waBtn.className = 'btn btn-whatsapp';
        waBtn.innerHTML = '<i class="fa-brands fa-whatsapp"></i> Kirim Bukti ke WhatsApp';
        waBtn.onclick = sendToWhatsApp;
        
        container.appendChild(waBtn);
    }

    // FUNGSI UNTUK MENGIRIM PESAN DENGAN FORMAT BARU
    function sendToWhatsApp() {
        const name = document.getElementById('buyerName').value;
        
        const text = `*BUKTI TRANSAKSI KASIR*\n` +
                     `----------------------------------\n` +
                     `👤 *Nama:* ${name}\n` +
                     `📦 *Produk:* ${finalProductName}\n` +
                     `⏳ *Masa Aktif:* ${finalMasaAktifText}\n` +
                     `💰 *Total Harga:* ${finalPriceText}\n` +
                     `💳 *Metode Bayar:* ${selectedMethod}\n` +
                     `----------------------------------\n` +
                     `Halo min saya sudah bayar nih`;

        const encodedText = encodeURIComponent(text);
        const waNumber = "6289654951306"; // Ganti dengan nomor WhatsApp tujuanmu
        
        window.open(`https://wa.me/${waNumber}?text=${encodedText}`, '_blank');
    }
</script>

</body>
</html>
